name: Story agent safety tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infamoushub-story-agent/**'
      - '.github/workflows/story-agent-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no internet, no upload, no rendering)
        working-directory: infamoushub-story-agent
        run: python -m unittest discover -s tests -v
